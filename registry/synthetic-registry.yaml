# Synthetic account registry for the simulated adapters.
#
# EVERYTHING HERE IS INVENTED. Names were made up for this project and are not meant to
# identify anyone. Identifiers use deliberately fake formats:
#   EU   IBAN-like strings containing "TEST" (they do not pass IBAN validation)
#   UK   sort codes 99-00-xx
#   IN   IFSC-like codes starting "TEST"
#   PIX  keys on the reserved ".example" domain, or all-zero UUIDs
#   LEI  "9999TESTPAYEE..." with valid ISO 17442 check digits, so the checksum code is exercised

