# Conformance corpus for the reference matcher.
#
# Every name is invented for this project and is not meant to identify a real person or
# company. Company-like names are fictional.
#
# `expected` is a hand-written judgement of what a careful responder SHOULD return. Labels
# were not generated from matcher output and were not changed after the first run. They
# were written by the same author as the matcher, so the accuracy figure measures
# consistency with stated intent; it is not an independent benchmark. Category
# `known_gap` holds cases the v0.1 heuristics are expected to get wrong (nicknames,
# acronyms, reordered initials); they are reported, not hidden.
#
# Gates (checked by `python -m payee_verdict corpus`):
#   overall accuracy >= threshold, and
#   zero unsafe upgrades: a MATCH predicted where the expected outcome is anything else.

version: 1
threshold: 0.90
cases:
  # --- exact: case and whitespace only -------------------------------------------------
