name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests && python -m ruff format --check src tests
      - name: Type check (strict)
        run: python -m mypy
      - name: Tests + branch coverage (fails under 90%)
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=90
      - name: Conformance corpus (fails below threshold or on any unsafe MATCH)
        run: python -m payee_verdict corpus
      - name: Demo runs end to end
        run: python -m payee_verdict demo
      - name: Bulk mode, 10,000 synthetic payouts
        run: |
          python -m payee_verdict generate --count 10000 --out /tmp/payouts.csv
          python -m payee_verdict bulk /tmp/payouts.csv --evidence /tmp/evidence.jsonl
          python -m payee_verdict replay /tmp/evidence.jsonl
      - name: Dependency vulnerability audit
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install pip-audit
          python -m pip_audit --skip-editable

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 detect --source /repo --redact -v

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 403 is accepted because several cited sources (EPC, Convera, Regulation Tomorrow)
      # return 403 to non-browser clients; 404 and DNS failures still fail the job.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 4 --retry-wait-time 5
            --accept 200,206,403,429
            --exclude 'github\.com/karthy1004/[^/]+/blob/'
            './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
